name: Safe PR checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      ONEKEY_AUDIO_SMOKE: '0'
      ONEKEY_DISCORD_RPC_SMOKE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test tests/Eslee.OneKey.Tests/Eslee.OneKey.Tests.csproj --configuration Release --logger trx --results-directory TestResults
      - run: dotnet build src/Eslee.OneKey.App/Eslee.OneKey.App.csproj --configuration Release
      - name: Record source and build hashes
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path TestResults -Force | Out-Null
          $sourceSha = git rev-parse HEAD
          $hashes = @(Get-ChildItem -LiteralPath src/Eslee.OneKey.App/bin/Release -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in '.dll', '.exe' } |
            Sort-Object FullName |
            ForEach-Object {
              [ordered]@{
                path = [IO.Path]::GetRelativePath((Get-Location).Path, $_.FullName)
                sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
              }
            })
          [ordered]@{
            source_sha = $sourceSha
            workflow_sha = $env:GITHUB_WORKFLOW_SHA
            run_id = $env:GITHUB_RUN_ID
            configuration = 'Release'
            build_hashes = $hashes
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath TestResults/build-provenance.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safe-unit-test-results
          path: |
            TestResults/*.trx
            TestResults/build-provenance.json
